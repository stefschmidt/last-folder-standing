name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # No explicit -G: let CMake pick the newest Visual Studio on the runner.
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Verify the shell extension
        # Drives the DLL through the calls Explorer makes, including malformed
        # PIDLs. Registration is not needed and not wanted on a runner.
        working-directory: build/bin/Release
        run: ./shellext_probe.exe

      - name: Check the monitor runs
        run: ./build/bin/Release/LFS.Monitor.exe --console --once

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path CMakeLists.txt -Pattern 'VERSION\s+(\d+\.\d+\.\d+)' |
                Select-Object -First 1).Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DBinDir=$(Resolve-Path build/bin/Release)" `
            installer/LastFolderStanding.iss

      - uses: actions/upload-artifact@v4
        with:
          name: LastFolderStanding-${{ steps.version.outputs.version }}
          path: installer/Output/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
