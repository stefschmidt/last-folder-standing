name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # No explicit -G: let CMake pick the newest Visual Studio on the runner,
        # so a new image with a newer VS does not break the build.
        run: cmake -S . -B build -A x64

      # /W4 /WX, so a warning fails the build.
      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Verify the shell extension
        working-directory: build/bin/${{ matrix.config }}
        run: ./shellext_probe.exe

      - name: Check the monitor runs
        run: ./build/bin/${{ matrix.config }}/LFS.Monitor.exe --console --once
